<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celarix Client — showcase</title>
<meta http-equiv="refresh" content="0; url=Versions/">
<link rel="canonical" href="Versions/">
<meta name="theme-color" content="#16181c">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="Versions/favicon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #16181c; color: #b0bac5;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  main { text-align: center; padding: 40px 24px; }
  img { width: 88px; height: 88px; border-radius: 18px; border: 1px solid rgba(193,190,209,.2); }
  h1 { margin: 20px 0 6px; color: #fff; font-size: 24px; letter-spacing: -.01em; }
  p { margin: 0 0 22px; font-size: 14.5px; }
  a.btn {
    display: inline-block; padding: 11px 20px; border-radius: 8px;
    background: #1bd96a; color: #04170c; font-weight: 600; font-size: 14px;
    text-decoration: none;
  }
  a.btn:hover { background: #42e686; }
  a.plain { display: block; margin-top: 14px; color: #4f9cff; font-size: 13.5px; }
</style>
</head>
<body>
  <main>
    <img src="Versions/logo.png" alt="Celarix Client">
    <h1>Celarix Client</h1>
    <p>Taking you to the showcase…</p>
    <a class="btn" href="Versions/">Open the showcase</a>
    <a class="plain" href="Versions/">If nothing happens, click here</a>
  </main>
</body>
</html>
